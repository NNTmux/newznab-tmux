name: Run tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP 8.5 via Sail
    env:
      SAIL_FILES: .github/docker-compose.ci.yml
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

    steps:
      - uses: actions/checkout@v5

      - name: Copy env file
        run: cp .env.test .env

      - name: Configure Sail identity
        run: |
          echo "WWWUSER=$(id -u)" >> "$GITHUB_ENV"
          echo "WWWGROUP=$(id -g)" >> "$GITHUB_ENV"

      - name: Start Sail
        run: ./sail up -d --build

      - name: Run composer install
        run: make composer-install

      - name: Generate app key
        run: |
          ./sail artisan key:generate --force

      - name: Run tests
        run: ./sail test --compact

      - name: Run permission and test-isolation regressions
        run: make test-permissions

      - name: Prove focused tests leave live caches unchanged
        run: make test-focused-cache-isolation

      - name: Build frontend and run JS tests
        run: |
          make npm-build
          ./sail npm run test:js

      - name: Verify production permissions
        run: |
          make fix-permissions
          make check-permissions

      - name: Stop Sail
        if: always()
        run: ./sail down
