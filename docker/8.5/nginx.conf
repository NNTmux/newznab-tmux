# Grafana Live uses websockets through the /grafana/ proxy below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    root "/var/www/html/public";
    index index.html index.htm index.php;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/xml text/css application/x-javascript text/javascript application/javascript application/xml application/xml+rss application/atom+xml image/x-icon font/opentype application/json;
    gzip_min_length 256;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";
    gzip_proxied any;
    gzip_comp_level 6;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /covers/ {
        root /var/www/html/storage;
    }
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
    }

    # Grafana (docker-compose.monitoring.yml). Docker DNS resolves the service at
    # request time, so nginx still starts without it (/grafana/ then returns 502). Grafana authenticates the auth_token JWT itself.
    location ^~ /grafana/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    access_log /dev/stdout;
    error_log stderr error;

    sendfile off;

    client_max_body_size 100m;

    location ~ \.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}
