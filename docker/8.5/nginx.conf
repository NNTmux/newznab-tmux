# Grafana Live uses websockets through the /grafana/ proxy below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    root "/var/www/html/public";
    index index.html index.htm index.php;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/xml text/css application/x-javascript text/javascript application/javascript application/xml application/xml+rss application/atom+xml image/x-icon font/opentype application/json;
    gzip_min_length 256;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";
    gzip_proxied any;
    gzip_comp_level 6;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /covers/ {
        root /var/www/html/storage;
    }
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
    }

    # Grafana (docker-compose.monitoring.yml). Docker DNS resolves the service at
    # request time, so nginx still starts without it (/grafana/ then returns 502).
    # Every request is checked against the Laravel session (/_nntmux/grafana-auth);
    # the login JWT it returns goes to Grafana as a header and never to the browser.
    location ^~ /grafana/ {
        auth_request /_nntmux/grafana-auth;
        auth_request_set $nntmux_grafana_jwt $upstream_http_x_nntmux_grafana_jwt;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Also replaces any X-JWT-Assertion sent by the client.
        proxy_set_header X-JWT-Assertion $nntmux_grafana_jwt;

        # Grafana's static assets need no login; skip the PHP round trip.
        location ^~ /grafana/public/ {
            auth_request off;
            set $grafana_upstream http://grafana:3000;
            proxy_pass $grafana_upstream;
        }
    }

    location = /_nntmux/grafana-auth {
        internal;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_pass_request_body off;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Subrequests report the original method and URI; Laravel must see this route.
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /admin/monitoring/grafana-auth;
        fastcgi_param QUERY_STRING "";
        fastcgi_param CONTENT_TYPE "";
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        # JSON answers make Laravel return 401/403 instead of a login redirect.
        fastcgi_param HTTP_ACCEPT application/json;
        fastcgi_param HTTP_X_REQUESTED_WITH XMLHttpRequest;
        fastcgi_param NNTMUX_GRAFANA_AUTH_REQUEST 1;
    }

    access_log /dev/stdout;
    error_log stderr error;

    sendfile off;

    client_max_body_size 100m;

    location ~ \.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}
