[package]
name = "nzb-yenc-ffi"
version = "0.1.0"
edition = "2024"
description = "C ABI shim exposing nzb-decode's yEnc decoder under RapidYenc's symbol names for NNTmux's FFI decoder"
license = "GPL-3.0-only"
publish = false

[lib]
name = "nzbyenc"
crate-type = ["cdylib", "rlib"]

[dependencies]
md-5 = "0.10"
nzb-decode = "=0.1.3"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
